---
apiVersion: v1
kind: Service
metadata:
  name: postgres-reservation
  namespace: flash-sale
spec:
  selector:
    app: postgres-reservation
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-reservation
  namespace: flash-sale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-reservation
  template:
    metadata:
      labels:
        app: postgres-reservation
    spec:
      containers:
        - name: postgres
          image: postgres:13
          env:
            - name: POSTGRES_DB
              value: reservation_db
            - name: POSTGRES_USER
              value: flash_sale_user
            - name: POSTGRES_PASSWORD
              value: flash-sale
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-order
  namespace: flash-sale
spec:
  selector:
    app: postgres-order
  ports:
    - port: 5432
---
apiVersion: apps/v1
