            - name: POSTGRES_USER
              value: flash_sale_user
            - name: POSTGRES_PASSWORD
              value: flash-sale
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: flash-sale
spec:
  selector:
    app: postgres-user
  ports:
    - port: 5432
---
